<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Sight-Reading Flashcards</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html, body {
            height: 100dvh; /* Dynamic Viewport Height accounts for dynamic browser toolbars */
            width: 100vw;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0d0b;
            color: #f3f4f6;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            /* Respect smartphone notch and bottom gesture bar safe areas */
            padding-top: max(0.5rem, var(--sat));
            padding-bottom: max(0.75rem, var(--sab));
            padding-left: max(0.5rem, var(--sal));
            padding-right: max(0.5rem, var(--sar));
        }

        .serif-font {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .parchment-card {
            background: #f8f4e9;
            background-image: radial-gradient(#ece2ca 15%, transparent 16%), radial-gradient(#ece2ca 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #1c1917;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(180, 150, 100, 0.2);
        }

        .tap-pulse {
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(245, 158, 11, 0.3); }
            50% { border-color: rgba(245, 158, 11, 0.9); }
            100% { border-color: rgba(245, 158, 11, 0.3); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between select-none cursor-pointer">

    <!-- Top Info Bar -->
    <header class="w-full max-w-5xl flex justify-between items-center px-4 py-2 bg-stone-900/90 border border-stone-800 rounded-2xl backdrop-blur-md shadow-lg shrink-0 z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-music text-amber-500 text-lg"></i>
            <h1 class="serif-font text-base md:text-2xl font-bold text-stone-100 tracking-tight">
                Piano Sight-Reading Tutor
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <span id="clefBadge" class="px-3 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold text-xs rounded-full uppercase tracking-wider">
                Grand Staff
            </span>
            <button id="btnReplay" class="p-2 hover:bg-stone-800 text-stone-400 hover:text-amber-400 rounded-xl transition" title="Replay Sound">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Display Stage (Dynamically fits above toolbar) -->
    <main class="w-full max-w-5xl flex-1 my-2 parchment-card rounded-3xl border border-amber-900/30 p-2 md:p-4 flex flex-col justify-center items-center relative overflow-hidden min-h-0">
        <div class="w-full h-full flex items-center justify-center">
            <svg id="staffSvg" viewBox="0 0 500 440" class="w-full h-full max-h-full select-none"></svg>
        </div>
    </main>

    <!-- Bottom Action Footer (Padded away from device home bars) -->
    <footer id="interactiveFooter" class="w-full max-w-5xl bg-stone-900/95 border-2 border-amber-500/40 tap-pulse rounded-2xl p-2.5 md:p-4 flex flex-row justify-between items-center gap-3 shrink-0 shadow-2xl transition-all z-10">
        
        <!-- Status Text -->
        <div class="flex items-center gap-3">
            <div id="statusIconBg" class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 shrink-0">
                <i id="statusIcon" class="fa-solid fa-hand-pointer text-base md:text-lg"></i>
            </div>
            <div>
                <span id="subText" class="text-[9px] md:text-[10px] uppercase tracking-widest text-stone-400 font-bold block">Tap Anywhere</span>
                <p id="mainInstruction" class="text-xs md:text-sm font-semibold text-stone-200 leading-snug">
                    Tap screen to reveal note name
                </p>
            </div>
        </div>

        <!-- Revealed Note Box -->
        <div id="noteBox" class="min-w-[110px] md:min-w-[160px] px-3 py-1.5 md:py-2 bg-stone-950 border border-stone-800 rounded-xl text-center flex flex-col justify-center shadow-inner">
            <span class="text-[8px] md:text-[9px] font-bold text-stone-500 uppercase tracking-widest block">Note Name</span>
            <span id="noteNameText" class="text-xl md:text-3xl font-black text-amber-400 font-mono tracking-tight">?</span>
        </div>

    </footer>

    <script>
        // Exact Grand Staff Note Library (C2 to C6)
        const FLASHCARD_NOTES = [
            // BASS CLEF (C2 - B3)
            { name: "C2", midi: 36, pitch: "C", octave: 2, clef: "Bass Clef", desc: "Low C (Ledger Line 2 Below)" },
            { name: "D2", midi: 38, pitch: "D", octave: 2, clef: "Bass Clef", desc: "Space Below Ledger Line 1" },
            { name: "E2", midi: 40, pitch: "E", octave: 2, clef: "Bass Clef", desc: "Low E (Ledger Line 1 Below)" },
            { name: "F2", midi: 41, pitch: "F", octave: 2, clef: "Bass Clef", desc: "Space Below Line 1" },
            { name: "G2", midi: 43, pitch: "G", octave: 2, clef: "Bass Clef", desc: "Line 1 (Bottom Line)" },
            { name: "A2", midi: 45, pitch: "A", octave: 2, clef: "Bass Clef", desc: "Space 1" },
            { name: "B2", midi: 47, pitch: "B", octave: 2, clef: "Bass Clef", desc: "Line 2" },
            { name: "C3", midi: 48, pitch: "C", octave: 3, clef: "Bass Clef", desc: "Space 2" },
            { name: "D3", midi: 50, pitch: "D", octave: 3, clef: "Bass Clef", desc: "Line 3 (Middle Line)" },
            { name: "E3", midi: 52, pitch: "E", octave: 3, clef: "Bass Clef", desc: "Space 3" },
            { name: "F3", midi: 53, pitch: "F", octave: 3, clef: "Bass Clef", desc: "Line 4" },
            { name: "G3", midi: 55, pitch: "G", octave: 3, clef: "Bass Clef", desc: "Space 4" },
            { name: "A3", midi: 57, pitch: "A", octave: 3, clef: "Bass Clef", desc: "Line 5 (Top Line)" },
            { name: "B3", midi: 59, pitch: "B", octave: 3, clef: "Bass Clef", desc: "Space Above Line 5" },

            // MIDDLE C (C4)
            { name: "C4", midi: 60, pitch: "C", octave: 4, clef: "Middle C", desc: "Middle C (Center Ledger Line)" },

            // TREBLE CLEF (D4 - C6)
            { name: "D4", midi: 62, pitch: "D", octave: 4, clef: "Treble Clef", desc: "Space Below Line 1" },
            { name: "E4", midi: 64, pitch: "E", octave: 4, clef: "Treble Clef", desc: "Line 1 (Bottom Line)" },
            { name: "F4", midi: 65, pitch: "F", octave: 4, clef: "Treble Clef", desc: "Space 1" },
            { name: "G4", midi: 67, pitch: "G", octave: 4, clef: "Treble Clef", desc: "Line 2" },
            { name: "A4", midi: 69, pitch: "A", octave: 4, clef: "Treble Clef", desc: "Space 2" },
            { name: "B4", midi: 71, pitch: "B", octave: 4, clef: "Treble Clef", desc: "Line 3 (Middle Line)" },
            { name: "C5", midi: 72, pitch: "C", octave: 5, clef: "Treble Clef", desc: "Space 3" },
            { name: "D5", midi: 74, pitch: "D", octave: 5, clef: "Treble Clef", desc: "Line 4" },
            { name: "E5", midi: 76, pitch: "E", octave: 5, clef: "Treble Clef", desc: "Space 4" },
            { name: "F5", midi: 77, pitch: "F", octave: 5, clef: "Treble Clef", desc: "Line 5 (Top Line)" },
            { name: "G5", midi: 79, pitch: "G", octave: 5, clef: "Treble Clef", desc: "Space Above Line 5" },
            { name: "A5", midi: 81, pitch: "A", octave: 5, clef: "Treble Clef", desc: "High A (Ledger Line 1 Above)" },
            { name: "B5", midi: 83, pitch: "B", octave: 5, clef: "Treble Clef", desc: "Space Above Ledger Line 1" },
            { name: "C6", midi: 84, pitch: "C", octave: 6, clef: "Treble Clef", desc: "High C (Ledger Line 2 Above)" }
        ];

        // --- Web Audio Synthesizer ---
        class AudioSynth {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPitch(midiNote, duration = 1.5) {
                this.init();
                const now = this.ctx.currentTime;
                const freq = 440 * Math.pow(2, (midiNote - 69) / 12);

                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 2, now);

                const osc2Gain = this.ctx.createGain();
                osc2Gain.gain.value = 0.2;
                osc2.connect(osc2Gain);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2200, now);
                filter.frequency.exponentialRampToValueAtTime(350, now + duration);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(0.85, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc1.connect(filter);
                osc2Gain.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration + 0.1);
                osc2.stop(now + duration + 0.1);
            }
        }

        // --- Grand Staff Renderer ---
        class GrandStaffRenderer {
            constructor(svgId) {
                this.svg = document.getElementById(svgId);
                
                // Reference Geometry
                this.Y_MID_C = 220;  // Middle C4 (Index 0)
                this.STEP_Y = 10;     // Diatonic step = 10px (Line spacing = 20px)
                this.X_LEFT = 100;
                this.X_RIGHT = 460;
                this.X_NOTE = 280;

                this.renderBaseStaff();
            }

            getDiatonicY(midi) {
                const octave = Math.floor(midi / 12) - 1;
                const noteInOctave = midi % 12;
                const diatonicMap = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
                
                const diatonicIndex = (octave - 4) * 7 + diatonicMap[noteInOctave];
                return { index: diatonicIndex, y: this.Y_MID_C - (diatonicIndex * this.STEP_Y) };
            }

            renderBaseStaff() {
                this.svg.innerHTML = '';
                const xL = this.X_LEFT;
                const xR = this.X_RIGHT;

                // 1. Thick Connecting Brace Bar on Left
                this.createLine(xL - 8, 120, xL - 8, 320, '#2b231d', '4');
                this.createLine(xL, 120, xL, 320, '#2b231d', '2');

                // 2. Treble Staff Lines
                for (let i = 0; i < 5; i++) {
                    const y = 200 - (i * 20);
                    this.createLine(xL, y, xR, y, '#3a2e25', '2');
                }

                // 3. Bass Staff Lines
                for (let i = 0; i < 5; i++) {
                    const y = 320 - (i * 20);
                    this.createLine(xL, y, xR, y, '#3a2e25', '2');
                }

                // 4. Large Clef Icons
                this.createText(xL - 52, 205, '𝄞', '92px'); // Treble
                this.createText(xL - 48, 278, '𝄢', '76px'); // Bass

                // Group for Dynamic Notes & Ledgers
                this.noteGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                this.svg.appendChild(this.noteGroup);
            }

            createLine(x1, y1, x2, y2, color = '#2b231d', width = '2') {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', width);
                this.svg.appendChild(line);
            }

            createText(x, y, text, fontSize) {
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                t.setAttribute('x', x);
                t.setAttribute('y', y);
                t.setAttribute('font-size', fontSize);
                t.setAttribute('fill', '#1c1917');
                t.textContent = text;
                this.svg.appendChild(t);
            }

            drawNote(noteData) {
                this.noteGroup.innerHTML = '';
                if (!noteData) return;

                const x = this.X_NOTE;
                const { index, y } = this.getDiatonicY(noteData.midi);

                // --- Ledger Lines Logic ---
                if (index === 0) {
                    this.createLedgerLine(x, this.Y_MID_C);
                }
                if (index >= 12) {
                    this.createLedgerLine(x, 100);
                    if (index >= 14) this.createLedgerLine(x, 80);
                }
                if (index <= -12) {
                    this.createLedgerLine(x, 340);
                    if (index <= -14) this.createLedgerLine(x, 360);
                }

                // Notehead
                const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                ellipse.setAttribute('cx', x);
                ellipse.setAttribute('cy', y);
                ellipse.setAttribute('rx', '13');
                ellipse.setAttribute('ry', '9');
                ellipse.setAttribute('transform', `rotate(-20 ${x} ${y})`);
                ellipse.setAttribute('fill', '#d97706');
                ellipse.setAttribute('stroke', '#78350f');
                ellipse.setAttribute('stroke-width', '2.8');
                this.noteGroup.appendChild(ellipse);

                // Stem
                const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                const stemUp = index < 0;
                stem.setAttribute('x1', stemUp ? x + 11 : x - 11);
                stem.setAttribute('y1', y);
                stem.setAttribute('x2', stemUp ? x + 11 : x - 11);
                stem.setAttribute('y2', stemUp ? y - 52 : y + 52);
                stem.setAttribute('stroke', '#78350f');
                stem.setAttribute('stroke-width', '2.8');
                this.noteGroup.appendChild(stem);
            }

            createLedgerLine(x, y) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x - 25);
                line.setAttribute('y1', y);
                line.setAttribute('x2', x + 25);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', '#1c1917');
                line.setAttribute('stroke-width', '2.2');
                this.noteGroup.appendChild(line);
            }
        }

        // --- App Controller ---
        class FlashcardApp {
            constructor() {
                this.synth = new AudioSynth();
                this.staffRenderer = new GrandStaffRenderer('staffSvg');

                this.state = 'START';
                this.currentNote = null;
                this.lastMidi = -1;

                this.bindUI();
            }

            bindUI() {
                this.mainInstruction = document.getElementById('mainInstruction');
                this.subText = document.getElementById('subText');
                this.noteNameText = document.getElementById('noteNameText');
                this.statusIcon = document.getElementById('statusIcon');
                this.statusIconBg = document.getElementById('statusIconBg');
                this.clefBadge = document.getElementById('clefBadge');
                this.btnReplay = document.getElementById('btnReplay');

                document.body.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('#btnReplay')) return;
                    this.handleTap();
                });

                this.btnReplay.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.currentNote) {
                        this.synth.playPitch(this.currentNote.midi);
                    }
                });
            }

            handleTap() {
                this.synth.init();

                if (this.state === 'START') {
                    this.pickAndDisplayNewNote();
                } else if (this.state === 'REVEAL_PENDING') {
                    this.revealNoteName();
                } else if (this.state === 'NEXT_PENDING') {
                    this.pickAndDisplayNewNote();
                }
            }

            pickAndDisplayNewNote() {
                let availableNotes = FLASHCARD_NOTES.filter(n => n.midi !== this.lastMidi);
                const randomIndex = Math.floor(Math.random() * availableNotes.length);
                this.currentNote = availableNotes[randomIndex];
                this.lastMidi = this.currentNote.midi;

                this.staffRenderer.drawNote(this.currentNote);
                this.synth.playPitch(this.currentNote.midi);

                this.state = 'REVEAL_PENDING';
                this.noteNameText.textContent = '?';
                this.noteNameText.classList.replace('text-amber-400', 'text-stone-600');

                this.subText.textContent = 'Tap Anywhere';
                this.mainInstruction.textContent = 'Tap screen to reveal note name';
                this.statusIcon.className = 'fa-solid fa-eye text-base md:text-lg';
                this.statusIconBg.className = 'w-9 h-9 md:w-10 md:h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 shrink-0';

                this.clefBadge.textContent = this.currentNote.clef;
            }

            revealNoteName() {
                if (!this.currentNote) return;

                this.state = 'NEXT_PENDING';

                this.noteNameText.textContent = this.currentNote.name;
                this.noteNameText.classList.replace('text-stone-600', 'text-amber-400');

                this.subText.textContent = 'Tap Again';
                this.mainInstruction.textContent = `It's ${this.currentNote.name} (${this.currentNote.desc})! Tap for next note.`;
                this.statusIcon.className = 'fa-solid fa-arrow-right text-base md:text-lg';
                this.statusIconBg.className = 'w-9 h-9 md:w-10 md:h-10 rounded-xl bg-teal-500/20 flex items-center justify-center text-teal-400 shrink-0';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new FlashcardApp();
        });
    </script>
</body>
</html>
